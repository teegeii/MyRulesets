# OpenClash remote overwrite module
# Converted from teegeii/MyRulesets rulesetmini.ini
# For OpenClash v0.47.081+ / Mihomo
# Changes: TW flag corrected; FINAL converted to MATCH; trailing backtick ignored.

[YAML]

proxy-groups!:
  - name: "Proxy"
    type: select
    proxies:
      - "Select"
      - "DIRECT"
      - "香港节点"
      - "台湾节点"
      - "狮城节点"
      - "日本节点"
      - "美国节点"
      - "韩国节点"
  - name: "Select"
    type: select
    proxies:
      - "香港节点"
      - "狮城节点"
      - "美国节点"
      - "日本节点"
      - "台湾节点"
      - "韩国节点"
    include-all: true
    exclude-type: "Direct|Reject"
  - name: "香港节点"
    type: select
    include-all: true
    exclude-type: "Direct|Reject"
    filter: "(?:(港|HK|Hong Kong|🇭🇰))"
  - name: "狮城节点"
    type: select
    include-all: true
    exclude-type: "Direct|Reject"
    filter: "(?:(新加坡|坡|狮城|SG|Singapore|🇸🇬))"
  - name: "美国节点"
    type: select
    include-all: true
    exclude-type: "Direct|Reject"
    filter: "(?:(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|JMS|🇺🇲|🇺🇸))"
  - name: "日本节点"
    type: select
    include-all: true
    exclude-type: "Direct|Reject"
    filter: "(?:(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan|🇯🇵))"
  - name: "台湾节点"
    type: select
    include-all: true
    exclude-type: "Direct|Reject"
    filter: "(?:(台|新北|彰化|TW|Taiwan|🇹🇼))"
  - name: "韩国节点"
    type: select
    include-all: true
    exclude-type: "Direct|Reject"
    filter: "(?:(KR|Korea|KOR|首尔|韩|韓|🇰🇷))"
