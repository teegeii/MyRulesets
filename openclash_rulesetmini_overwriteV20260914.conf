# MyRulesets OpenClash 本地覆写模块；生成日期：2026-09-14
# 来源：本次用户粘贴的 INI 正文，未声称已核对 GitHub 最新内容。
# 对应源地址：https://raw.githubusercontent.com/teegeii/MyRulesets/refs/heads/main/ruleset_20260911_mini_20260911update.ini
# 使用方式：将整个文件内容导入支持 [YAML] 的 OpenClash 覆写模块。
# 本文件不是独立 Mihomo 主配置；[YAML] 与 ! 操作符由 OpenClash 处理。
# 替换全部策略组和规则；从原订阅 proxies / proxy-providers 引入节点。
# 保留源规则顺序、显式组引用顺序及节点正则；多个正则按“或”合并。
# 动态节点由 Mihomo 按名称排序，不能保证与 subconverter 展示顺序完全一致。
# 未附带节点、GeoIP 数据或远程规则正文；路由器须能获取这些依赖。
# 原始靠前的中国直连规则可能优先命中后面的业务规则，此处按原样保留。

