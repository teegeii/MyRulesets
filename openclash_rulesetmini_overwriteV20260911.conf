# teegeii / MyRulesets 本地覆写（保留原顺序）
# 需要支持 [YAML] 覆写模块的 OpenClash，以及较新的 Meta/mihomo 核心。
# 保留订阅节点和节点提供者；替换策略组、分流规则；合并本规则集。
# 不是独立机场配置，不含订阅地址。不要导入到普通配置文件页面。
# 规则集经 Proxy 下载，每 86400 秒更新。地区空组回退 REJECT。
# 原 ChinaMax、Google 等前置规则的优先级原样保留，详见使用说明。

[General]
CORE_TYPE = Meta
PROXY_MODE = rule
# 关闭大陆 IP 绕过，让本规则中的代理/直连选择能够实际生效。
CHINA_IP_ROUTE = 0
CHINA_IP6_ROUTE = 0

[YAML]
mode: "rule"

proxy-groups!:
  - name: "Proxy"
    type: "select"
    proxies: ["Select", "DIRECT"]
  - name: "Select"
    type: "select"
    proxies: ["香港节点", "狮城节点", "美国节点", "日本节点", "台湾节点", "韩国节点"]
    include-all: true
  - name: "香港节点"
    type: "select"
    include-all: true
    filter: '(港|HK|Hong Kong|🇭🇰)'
    empty-fallback: "REJECT"
  - name: "狮城节点"
    type: "select"
    include-all: true
    filter: '(新加坡|坡|狮城|SG|Singapore|🇸🇬)'
    empty-fallback: "REJECT"
  - name: "美国节点"
    type: "select"
    include-all: true
    filter: '(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|JMS|🇺🇲|🇺🇸)'
    empty-fallback: "REJECT"
  - name: "日本节点"
    type: "select"
    include-all: true
    filter: '(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan|🇯🇵)'
    empty-fallback: "REJECT"
  - name: "台湾节点"
    type: "select"
    include-all: true
    filter: '(台|新北|彰化|TW|Taiwan)'
    empty-fallback: "REJECT"
  - name: "韩国节点"
    type: "select"
    include-all: true
    filter: '(KR|Korea|KOR|首尔|韩|韓|🇰🇷)'
    empty-fallback: "REJECT"
  - name: "Speedtest"
    type: "select"
    proxies: ["Proxy", "Select", "DIRECT", "Netflix", "Emby", "YouTube", "香港节点", "台湾节点", "狮城节点", "日本节点", "美国节点", "韩国节点"]
    include-all: true
  - name: "FINAL"
    type: "select"
    proxies: ["Proxy", "DIRECT", "Select"]
  - name: "Microsoft"
    type: "select"
    proxies: ["美国节点", "狮城节点", "香港节点", "DIRECT", "Proxy", "Select", "台湾节点", "日本节点", "韩国节点"]
  - name: "OneDrive"
    type: "select"
    proxies: ["Microsoft", "美国节点", "狮城节点", "香港节点", "DIRECT", "Proxy", "Select", "台湾节点", "日本节点", "韩国节点"]
  - name: "OneDriveEDU"
    type: "select"
    proxies: ["OneDrive", "美国节点", "狮城节点", "香港节点", "DIRECT", "Proxy", "Select", "台湾节点", "日本节点", "韩国节点"]
  - name: "OneDrive21Vianet"
    type: "select"
    proxies: ["DIRECT", "Microsoft", "香港节点", "Proxy", "Select"]
  - name: "Telegram"
    type: "select"
    proxies: ["美国节点", "狮城节点", "Proxy", "Select", "DIRECT", "香港节点", "台湾节点", "日本节点", "韩国节点"]
  - name: "TelegramSG"
    type: "select"
    proxies: ["Telegram", "狮城节点", "Proxy", "Select", "DIRECT", "香港节点", "台湾节点", "日本节点", "美国节点", "韩国节点"]
  - name: "TelegramUS"
    type: "select"
    proxies: ["Telegram", "美国节点", "Proxy", "Select", "DIRECT", "狮城节点", "香港节点", "台湾节点", "日本节点", "韩国节点"]
  - name: "Emby"
    type: "select"
    proxies: ["香港节点", "美国节点", "狮城节点", "日本节点", "DIRECT", "Proxy", "Select", "台湾节点", "韩国节点"]
    include-all: true
  - name: "Netflix"
    type: "select"
    proxies: ["狮城节点", "Proxy", "Select", "DIRECT", "香港节点", "台湾节点", "日本节点", "美国节点", "韩国节点"]
