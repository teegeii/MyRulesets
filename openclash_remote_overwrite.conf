# MyRulesets - OpenClash Remote Overwrite Module
# Source logic: rulesetmini.ini
# Target: OpenClash >= v0.47.081 + Mihomo/Meta core
#
# Maintenance model:
# 1) Upload this file to your GitHub repository.
# 2) Add its raw.githubusercontent.com URL as an OpenClash remote overwrite module.
# 3) Your existing subscription continues to provide proxy nodes.
# 4) This module replaces rule-providers / proxy-groups / rules.
#
# Notes:
# - Taiwan flag regex corrected from 🇨🇳 to 🇹🇼.
# - Exact duplicate rule references in the original INI were removed.
# - All remote rule files refresh every 86400 seconds.
#
[YAML]
rule-providers!:
